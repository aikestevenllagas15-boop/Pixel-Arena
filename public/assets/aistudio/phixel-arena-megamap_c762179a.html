      <g class="pa-anim-recoil" style="transform-origin:60px 37px;">
        <rect x="4" y="33" width="110" height="8" fill="#38bdf8" rx="2"/>
        <rect x="4" y="29" width="32" height="16" fill="#1060a0" rx="2"/>
        <rect x="80" y="27" width="22" height="20" fill="#38bdf8" rx="2"/>
        <rect x="86" y="31" width="10" height="12" fill="#fff" opacity=".25" rx="1"/>
        <!-- scope ring (animated pulse) -->
        <circle cx="38" cy="37" r="6" fill="none" stroke="#38bdf8" stroke-width="2"
                style="animation:pa-scope .4s ease-in-out 2;"/>
        <line x1="34" y1="37" x2="42" y2="37" stroke="#38bdf8" stroke-width="1" opacity=".8"/>
        <line x1="38" y1="33" x2="38" y2="41" stroke="#38bdf8" stroke-width="1" opacity=".8"/>
      </g>
      <line x1="116" y1="37" x2="176" y2="37" stroke="#38bdf8" stroke-width="2" opacity=".9"
            style="animation:pa-muzzle .5s ease-out forwards;"/>`,
    // knife
    5: () => `
      <g class="pa-anim-slash" style="transform-origin:90px 40px;">
        <polygon points="70,20 130,35 125,55 65,40" fill="#39e58c" opacity=".9"/>
        <polygon points="72,22 128,36 126,46 68,32" fill="#20f880" opacity=".5"/>
        <!-- slash trail -->
        <line x1="60" y1="60" x2="140" y2="15" stroke="#39e58c" stroke-width="3" opacity=".7"/>
        <line x1="65" y1="58" x2="145" y2="13" stroke="#fff" stroke-width="1" opacity=".4"/>
      </g>`
  };

  // ── State ───────────────────────────────────────────────────────
  const state = {
    coins: 200,
    owned: new Set([0]),    // carbine is free
    equipped: 0,
    shopOpen: false,
    droneActive: false,
    droneQueue: [],
    gamePhase: 'menu',      // synced from game
    lastKills: 0,
    animTimeout: null,
    prevWeaponId: 0,
  };

  // ── DOM references ──────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const shopPanel   = $('pa-shop-panel');
  const shopBody    = $('pa-shop-body');
  const shopBtn     = $('pa-shop-btn');
  const coinsEl     = $('pa-coins-display');
  const weaponAnim  = $('pa-weapon-anim');
  const weaponAnimSvg = $('pa-weapon-anim-svg');
  const droneSvg    = $('pa-drone-svg');
  const droneRope   = $('pa-drone-rope');
  const dropBox     = $('pa-drop-box');
  const toastEl     = $('pa-delivery-toast');
  const boxIcon     = $('pa-box-icon');
  const dtWeapon    = $('pa-dt-weapon-name');

  // ── Utility ─────────────────────────────────────────────────────
  function saveState() {
    try {
      localStorage.setItem('pa_shop_v1', JSON.stringify({
        coins: state.coins,
        owned: [...state.owned],
        equipped: state.equipped
      }));
    } catch(e) {}
  }
  function loadState() {
    try {
      const d = JSON.parse(localStorage.getItem('pa_shop_v1') || '{}');
      if (d.coins !== undefined) state.coins = d.coins;
      if (d.owned)   d.owned.forEach(id => state.owned.add(id));
      if (d.equipped !== undefined) state.equipped = d.equipped;
    } catch(e) {}
    // ensure carbine always owned
    state.owned.add(0);
  }
  loadState();

  function updateCoinsDisplay() {
    coinsEl.textContent = state.coins;
  }

  // ── Shop render ─────────────────────────────────────────────────
  function renderShop() {
    updateCoinsDisplay();
    shopBody.innerHTML = '';
    SHOP_WEAPONS.forEach(w => {
      const owned    = state.owned.has(w.id);
      const equipped = state.equipped === w.id;
      const canAfford= state.coins >= w.price || owned;

      const card = document.createElement('div');
      card.className = 'pa-weapon-card' +
        (equipped ? ' equipped' : owned ? ' owned' : !canAfford ? ' cant-afford' : '');

      // weapon SVG art
      const artSvg = `<svg class="pa-weapon-art" viewBox="0 0 72 46" xmlns="http://www.w3.org/2000/svg">
        ${WEAPON_SVG[w.id] || ''}
      </svg>`;

      // stats bars
      const statsHtml = Object.entries(w.stats).map(([k,v]) =>
        `<div class="pa-stat">${k} <span>${v}</span></div>`
      ).join('');

      // button
      let btnHtml;
      if (equipped) {
        btnHtml = `<button class="pa-weapon-btn equipped-label">✓ EQUIPPED</button>`;
      } else if (owned) {
        btnHtml = `<button class="pa-weapon-btn equip" data-id="${w.id}">⚡ EQUIP NOW</button>`;
      } else if (canAfford) {
        btnHtml = `<button class="pa-weapon-btn buy" data-id="${w.id}" data-price="${w.price}">
          🛒 BUY ${w.price > 0 ? '🪙' + w.price : 'FREE'}
        </button>`;
      } else {
        btnHtml = `<button class="pa-weapon-btn buy" disabled style="opacity:.4;cursor:not-allowed;">
          🔒 🪙 ${w.price}
        </button>`;
      }

      card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;">
          <div>
            <div class="pa-weapon-name">${w.icon} ${w.name}</div>
            <div class="pa-weapon-tag">${w.tag}</div>
          </div>
          ${w.price > 0 && !owned ? `<div class="pa-coins-badge" style="font-size:10px;">🪙${w.price}</div>` : ''}
        </div>
        ${artSvg}
        <div style="font-size:9px;color:rgba(255,255,255,.55);">${w.desc}</div>
        <div class="pa-weapon-stats">${statsHtml}</div>
        ${btnHtml}
      `;
      shopBody.appendChild(card);
    });

    // events
    shopBody.querySelectorAll('[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id    = parseInt(btn.dataset.id);
        const price = parseInt(btn.dataset.price || '0');
        if (btn.classList.contains('buy')) {
          if (!state.owned.has(id) && state.coins >= price) {
            state.coins -= price;
            state.owned.add(id);
            saveState();
            closeShop();
            launchDroneDelivery(id);
          }
        } else if (btn.classList.contains('equip')) {
          state.equipped = id;
          saveState();
          closeShop();
          triggerWeaponSwap(id);
        }
      });
    });
  }

  // ── Open / close shop ───────────────────────────────────────────
  function openShop() {
    state.shopOpen = true;
    renderShop();
    shopPanel.style.display = 'flex';
  }
  function closeShop() {
    state.shopOpen = false;
    shopPanel.style.display = 'none';
  }

  // The icon opens the game's own supply shop (real, usable weapons) by
  // triggering the game's built-in (hidden) shop button.
  $('pa-shop-open-btn').addEventListener('click', e => {
    e.stopPropagation();
    const real = document.querySelector('button#pa-shop-btn');
    if (real) real.click();
  });
  $('pa-shop-close').addEventListener('click', closeShop);
  shopPanel.addEventListener('click', e => {
    if (e.target === shopPanel) closeShop();
  });

  // ── Weapon USE animation ─────────────────────────────────────────
  function playWeaponAnim(weaponId) {
    return; // disabled: the game draws the real weapon
    if (state.animTimeout) clearTimeout(state.animTimeout);

    const fn = WEAPON_ANIM_SVG[weaponId];
    if (!fn) return;

    weaponAnimSvg.innerHTML = fn(true);
    weaponAnim.style.display = 'block';

    // hide after animation
    const dur = weaponId === 5 ? 500 : weaponId === 4 ? 700 : weaponId === 1 ? 400 : 350;
    state.animTimeout = setTimeout(() => {
      weaponAnim.style.display = 'none';
    }, dur);
  }

  // Esc closes the shop (it only opens from the shop icon)
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.shopOpen) {
      closeShop();
    }
  });

  // ── Drone delivery animation ─────────────────────────────────────
  function launchDroneDelivery(weaponId) {
    const weapon = SHOP_WEAPONS[weaponId];
    if (!weapon) return;

    const startX = window.innerWidth / 2 - 55;
    const startY = -80;
    const endX   = window.innerWidth / 2 - 55;
    const endY   = window.innerHeight * 0.35;

    // position drone
    droneSvg.style.display = 'block';
    droneSvg.style.left    = startX + 'px';
    droneSvg.style.top     = startY + 'px';
    droneSvg.style.transform = 'none';

    // set box icon
    boxIcon.textContent = weapon.icon;
    dropBox.style.display = 'none';
    droneRope.style.display = 'none';

    let startTime = null;
    const flyDuration = 1200;

    function flyIn(ts) {
      if (!startTime) startTime = ts;
      const t = Math.min((ts - startTime) / flyDuration, 1);
      // ease-out
      const ease = 1 - Math.pow(1 - t, 3);
      const x = startX + (endX - startX) * ease;
      const y = startY + (endY - startY) * ease;

      droneSvg.style.left = x + 'px';
      droneSvg.style.top  = y + 'px';

      if (t < 1) {
        requestAnimationFrame(flyIn);
      } else {
        // arrived — lower the box
        lowerBox(endX, endY);
      }
    }
    requestAnimationFrame(flyIn);
  }

  function lowerBox(droneX, droneY) {
    // show rope
    droneRope.style.display = 'block';
    droneRope.style.left    = (droneX + 54) + 'px';
    droneRope.style.top     = (droneY + 38) + 'px';
    droneRope.style.height  = '0px';
    droneRope.style.transition = 'height 0.6s ease-in';

    // show box
    dropBox.style.display   = 'block';
    dropBox.style.left      = (droneX + 39) + 'px';
    dropBox.style.top       = (droneY + 38) + 'px';
    dropBox.style.animation = 'none';

    setTimeout(() => {
      droneRope.style.height = '48px';
    }, 50);

    // fall
    setTimeout(() => {
      dropBox.style.animation = 'pa-box-fall 0.7s ease-in forwards';

      // show toast
      setTimeout(() => {
        const w = SHOP_WEAPONS.find(x => x.icon === boxIcon.textContent);
        dtWeapon.textContent = w ? w.name : 'WEAPON ACQUIRED';
        toastEl.style.display = 'block';
        toastEl.style.animation = 'pa-toast-in .4s ease-out forwards';

        // equip weapon and trigger anim
        const wid = SHOP_WEAPONS.findIndex(x => x.icon === boxIcon.textContent);
        if (wid >= 0) {
          state.equipped = wid;
          saveState();
          triggerWeaponSwap(wid);
        }

        // rope shrinks
        droneRope.style.animation = 'pa-rope-shrink 0.4s ease-out forwards';

        // fly drone away
        setTimeout(() => {
          flyDroneAway();
        }, 500);

        // hide toast
        setTimeout(() => {
          toastEl.style.animation = 'pa-toast-out .3s ease-in forwards';
          setTimeout(() => { toastEl.style.display = 'none'; }, 300);
        }, 2000);

        // box bounce and disappear
        setTimeout(() => {
          dropBox.style.animation = 'pa-box-bounce .3s ease-out 2';
          setTimeout(() => {
            dropBox.style.display = 'none';
            droneRope.style.display = 'none';
          }, 700);
        }, 400);
      }, 600);
    }, 700);
  }

  function flyDroneAway() {
    const drone = droneSvg;
    const startX = parseFloat(drone.style.left);
    const startY = parseFloat(drone.style.top);
    const endX   = window.innerWidth + 150;
    const endY   = -100;
    let startTime = null;
    const dur = 900;

    function fly(ts) {
      if (!startTime) startTime = ts;
      const t = Math.min((ts - startTime) / dur, 1);
      const ease = t * t;
      drone.style.left = (startX + (endX - startX) * ease) + 'px';
      drone.style.top  = (startY + (endY - startY) * ease) + 'px';
      if (t < 1) {
        requestAnimationFrame(fly);
      } else {
        drone.style.display = 'none';
      }
    }
    requestAnimationFrame(fly);
  }

  // ── Weapon swap animation (3D-style screen flash) ───────────────
  function triggerWeaponSwap(weaponId) {
    // brief flash
    const flash = document.createElement('div');
    flash.style.cssText = `
      position:fixed;inset:0;z-index:51;pointer-events:none;
      background:rgba(25,230,255,.18);
      transition:opacity .3s;
    `;
    document.body.appendChild(flash);
    setTimeout(() => { flash.style.opacity = '0'; }, 50);
    setTimeout(() => { flash.remove(); }, 350);

    // play weapon reveal anim
    setTimeout(() => playWeaponAnim(weaponId), 150);
  }

  // ── Game state sync (polls React state via DOM observation) ──────
  // We watch the HUD for signals: phase, kills, weaponId, etc.
  // The game renders ammo/weapon info into the DOM, so we extract it.

  let lastDetectedPhase = 'menu';
  let killGrantTimer = null;

  function detectGameState() {
    // Check if game canvas / 3D scene is visible
    const canvas = document.querySelector('canvas');
    const inGame  = canvas && canvas.offsetParent !== null;

    // Detect playing vs menu by looking for HUD elements
    // The game's HUD has specific class combos we can probe
    const hudEl = document.querySelector('.fixed.inset-0.z-\\[25\\]');
    const playing = !!hudEl;

    if (playing && lastDetectedPhase !== 'playing') {
      lastDetectedPhase = 'playing';
      state.gamePhase = 'playing';
      shopBtn.style.display = 'block';
    } else if (!playing && lastDetectedPhase === 'playing') {
      lastDetectedPhase = 'menu';
      state.gamePhase = 'menu';
      shopBtn.style.display = 'none';
      closeShop();
    }

    // ── Auto-fire weapon animation when firing ──
    // Detect weapon use from HUD recoil indicator (class changes)
    if (playing) {
      // Grant coins periodically as a simulation (1 coin/sec + bonus on kill)
      if (!killGrantTimer) {
        killGrantTimer = setInterval(() => {
          if (state.gamePhase === 'playing') {
            state.coins += 1;
            updateCoinsDisplay();
            saveState();
          }
        }, 1000);
      }
    } else {
      if (killGrantTimer) {
        clearInterval(killGrantTimer);
        killGrantTimer = null;
      }
    }
  }

  // Poll every 500ms
  setInterval(detectGameState, 500);
  detectGameState();

  // ── Hook into keyboard weapon fire for animation ─────────────────
  // The game listens to mousedown/touch for fire; we intercept to show anim
  let fireCooldown = false;
  document.addEventListener('mousedown', e => {
    if (e.button === 0 && state.gamePhase === 'playing' && !state.shopOpen) {
      if (!fireCooldown) {
        fireCooldown = true;
        playWeaponAnim(state.equipped);
        // cooldown based on weapon fire rate
        const w = SHOP_WEAPONS[state.equipped];
        const cd = state.equipped === 5 ? 500 : state.equipped === 4 ? 1200 : state.equipped === 1 ? 580 : state.equipped === 2 ? 780 : 150;
        setTimeout(() => { fireCooldown = false; }, cd);
      }
    }
  }, true);

  // Touch fire
  document.addEventListener('touchstart', e => {
    if (state.gamePhase === 'playing' && !state.shopOpen) {
      if (!fireCooldown) {
        fireCooldown = true;
        playWeaponAnim(state.equipped);
        const cd = state.equipped === 5 ? 500 : state.equipped === 4 ? 1200 : state.equipped === 1 ? 580 : 150;
        setTimeout(() => { fireCooldown = false; }, cd);
      }
    }
  }, true);

  // ── Coin bonus for kills (detect kill feed changes) ──────────────
  const killObserver = new MutationObserver(() => {
    // Count kill feed items - if more than before, award coins
    const killFeedItems = document.querySelectorAll('[class*="killFeed"] > *, [class*="kill-feed"] > *');
    // Simple: scan for red-colored popup texts which appear on kills
    // Award 50 coins on detected new popups
  });

  // Observe body for kill popup additions
  const bodyObserver = new MutationObserver(mutations => {
    mutations.forEach(m => {
      m.addedNodes.forEach(node => {
        if (node.nodeType === 1) {
          // kill popup has 'animate-pop-fade' class
          if (node.classList && node.classList.contains('animate-pop-fade')) {
            const txt = node.textContent || '';
            if (txt.includes('+') || txt.includes('KILL') || txt.includes('HEAD')) {
              state.coins += 50;
              updateCoinsDisplay();
              saveState();
            }
          }
        }
      });
    });
  });
  bodyObserver.observe(document.body, { childList: true, subtree: true });

  // ── Init display ─────────────────────────────────────────────────
  updateCoinsDisplay();

  console.log('[Pixel Arena Shop] Loaded ✓ — tap the shop icon during play');
})();
</script>

      { id: 'ammo',    icon: '🔋', name: 'AMMO CACHE',    qty: '+60 Ammo',  weight: 20 },
      { id: 'weapon',  icon: '🔫', name: 'WEAPON FIND',   qty: 'New Gun!',  weight: 14 },
      { id: 'grenade', icon: '💣', name: 'GRENADE STASH', qty: '+2 Frags',  weight: 10 },
      { id: 'score',   icon: '⭐', name: 'LOOT BONUS',    qty: '+800 Pts',  weight: 10 },
      { id: 'dash',    icon: '⚡', name: 'DASH CHARGE',   qty: 'Full Dash!',weight: 6  },
    ],
  };

  // Weapons list for weapon pickup loot
  const WEAPON_NAMES = ['PULSE CARBINE','SCATTER BLASTER','RAIL CANNON','VIPER PISTOL','LONGSHOT SNIPER','ARC KNIFE'];

  // ── State ──────────────────────────────────────────────────────
  let nearestCrate = null;    // {type, mesh, worldPos, looted}
  let lootedSet   = new Set();// mesh UUIDs already looted
  let playerPos   = null;     // THREE.Vector3 estimated from camera
  let gamePhase   = 'menu';
  let gameMode    = 'classic';
  let eKeyDown    = false;

  // ── DOM refs ───────────────────────────────────────────────────
  const promptEl    = document.getElementById('pa-loot-prompt');
  const lootBtn     = document.getElementById('pa-loot-btn');
  const lootLabel   = document.getElementById('pa-loot-label');
  const lootSublabel= document.getElementById('pa-loot-sublabel');
  const toastEl     = document.getElementById('pa-loot-toast');
  const svLootEl    = document.getElementById('pa-survival-loot');

  // ── Utility ────────────────────────────────────────────────────
  function weightedRandom(table) {
    const total = table.reduce((s, e) => s + e.weight, 0);
    let r = Math.random() * total;
    for (const entry of table) {
      r -= entry.weight;
      if (r <= 0) return entry;
    }
    return table[table.length - 1];
  }

  function showToast(items) {
    toastEl.innerHTML = '';
    toastEl.style.display = 'flex';
    items.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'pa-loot-item-row';
      row.style.animationDelay = `${i * 80}ms`;
      row.innerHTML = `
        <span class="pa-loot-item-icon">${item.icon}</span>
        <span class="pa-loot-item-name">${item.name}</span>
        <span class="pa-loot-item-qty">${item.qty}</span>
      `;
      toastEl.appendChild(row);
    });
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => { toastEl.style.display = 'none'; }, 2200);
  }

  function addSvLootEntry(item) {
    const el = document.createElement('div');
    el.className = 'pa-sv-loot-entry';
    el.innerHTML = `<span>${item.icon}</span><span>${item.name} <span style="color:#ffcf40">${item.qty}</span></span>`;
    svLootEl.insertBefore(el, svLootEl.firstChild);
    // Keep max 5 entries
    while (svLootEl.children.length > 5) svLootEl.removeChild(svLootEl.lastChild);
    setTimeout(() => {
      el.style.transition = 'opacity .4s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 450);
    }, 3500);
  }

  // ── Apply loot effect to game state ───────────────────────────
  function applyLoot(item) {
    // Try to find the game's internal React state dispatcher
    // We use DOM mutation tricks: inject popups via the same popups array pattern
    // and attempt to modify health/ammo/shield via keyboard event simulation.
    const isSurvival = gameMode === 'survival';

    if (item.id === 'ammo') {
      // Simulate pressing R (reload) won't add ammo, but we fire a custom event
      window.dispatchEvent(new CustomEvent('pa_loot_ammo', { detail: { amount: isSurvival ? 60 : 30 } }));
    } else if (item.id === 'health') {
      window.dispatchEvent(new CustomEvent('pa_loot_health', { detail: { amount: isSurvival ? 50 : 25 } }));
    } else if (item.id === 'shield') {
      window.dispatchEvent(new CustomEvent('pa_loot_shield', { detail: { amount: isSurvival ? 50 : 20 } }));
    } else if (item.id === 'grenade') {
      window.dispatchEvent(new CustomEvent('pa_loot_grenade', { detail: { amount: isSurvival ? 2 : 1 } }));
    } else if (item.id === 'score') {
      window.dispatchEvent(new CustomEvent('pa_loot_score', { detail: { amount: isSurvival ? 800 : 500 } }));
    } else if (item.id === 'weapon') {
      const wid = Math.floor(Math.random() * 5); // random weapon 0-4
      window.dispatchEvent(new CustomEvent('pa_loot_weapon', { detail: { weaponId: wid } }));
      item.qty = WEAPON_NAMES[wid] || 'NEW WEAPON';
    } else if (item.id === 'dash') {
      window.dispatchEvent(new CustomEvent('pa_loot_dash', { detail: {} }));
    }

    // Show visual feedback
    showToast([item]);
    if (isSurvival) addSvLootEntry(item);

    // Coin bonus for shop system
    try {
      const stored = JSON.parse(localStorage.getItem('pa_shop_state') || '{}');
      stored.coins = (stored.coins || 0) + (isSurvival ? 75 : 35);
      localStorage.setItem('pa_shop_state', JSON.stringify(stored));
    } catch {}
  }

  // ── Loot a crate ──────────────────────────────────────────────
  function lootCrate() {
    if (!nearestCrate || lootedSet.has(nearestCrate.id)) return;

    lootedSet.add(nearestCrate.id);
    nearestCrate.looted = true;

    // Pick loot
    const isSurvival = gameMode === 'survival';
    const tableKey   = isSurvival ? 'survival'
                     : nearestCrate.type === 'supply' ? 'supplyCrate' : 'crate';
    const table      = LOOT_TABLES[tableKey];

    // Supply crates give 2–3 items; regular crates give 1
    const count = nearestCrate.type === 'supply' ? (Math.random() < .45 ? 3 : 2) : 1;
    const items  = [];
    const usedIds = new Set();
    for (let i = 0; i < count; i++) {
      let item;
      let attempts = 0;
      do { item = weightedRandom(table); attempts++; } while (usedIds.has(item.id) && attempts < 8);
      usedIds.add(item.id);
      items.push({ ...item }); // clone so qty can be mutated
    }

    // Apply effects
    items.forEach(it => applyLoot(it));

    // Visual: break/shrink the crate mesh if we can find it
    breakCrateMesh(nearestCrate.meshRef);

    // Hide prompt
    promptEl.style.display = 'none';
    nearestCrate = null;
  }

  // ── Visually break a crate (scale down + fade) ────────────────
  function breakCrateMesh(mesh) {
    if (!mesh || !mesh.scale) return;
    let t = 0;
    const origScale = { x: mesh.scale.x, y: mesh.scale.y, z: mesh.scale.z };
    const anim = setInterval(() => {
      t += 0.08;
      const s = Math.max(0, 1 - t);
      mesh.scale.set(origScale.x * s, origScale.y * s, origScale.z * s);
      if (mesh.material) {
        if (Array.isArray(mesh.material)) {
          mesh.material.forEach(m => { if (m.opacity !== undefined) m.opacity = s; m.transparent = true; });
        } else {
          mesh.material.opacity = s;
          mesh.material.transparent = true;
        }
      }
      if (t >= 1) {
        clearInterval(anim);
        mesh.visible = false;
        // Restore after 45s so crates respawn
        setTimeout(() => {
          mesh.visible = true;
          mesh.scale.set(origScale.x, origScale.y, origScale.z);
          if (mesh.material) {
            if (Array.isArray(mesh.material)) mesh.material.forEach(m => { m.opacity = 1; });
            else mesh.material.opacity = 1;
          }
        }, 45000);
      }
    }, 30);
  }

  // ── Find Three.js scene & player camera ───────────────────────
  function getThreeContext() {
    const canvas = document.querySelector('canvas');
    if (!canvas) return null;
    // Three.js injects __three into the renderer's domElement
    const renderer = canvas._renderer || canvas.__renderer;
    if (renderer) return { renderer };
    // Try window.__paThree set by the game
    if (window.__paThree) return window.__paThree;
    return null;
  }

  // ── Scan scene for crate meshes ───────────────────────────────
  // The game uses BoxGeometry for crates. We identify them by userData or geometry size.
  function scanCrates(scene) {
    const crates = [];
    if (!scene) return crates;

    scene.traverse(obj => {
      if (!obj.isMesh) return;
      if (!obj.visible) return;
      if (lootedSet.has(obj.uuid)) return;

      // Destructible crates have userData.crateIdx set by map builder
      const isDestructible = obj.userData && obj.userData.crateIdx !== undefined;

      // Supply crates (airdrop boxes) are ~2×2×2 cubes
      let isSupplyCrate = false;
      if (obj.geometry && obj.geometry.parameters) {
        const { width = 0, height = 0, depth = 0 } = obj.geometry.parameters;
        // Crate-sized: roughly 1–2.5 units on each axis
        if (width >= 1 && width <= 2.8 && height >= 1 && height <= 2.8 && depth >= 1 && depth <= 2.8) {
          // Also check material — supply crates have a texture-mapped material
          const mat = Array.isArray(obj.material) ? obj.material[0] : obj.material;
          if (mat && mat.map) isSupplyCrate = true;
        }
      }

      if (isDestructible || isSupplyCrate) {
        let wp = { x: obj.position.x, y: obj.position.y, z: obj.position.z };
        try {
          obj.updateWorldMatrix(true, false);
          const e = obj.matrixWorld.elements;
          wp = { x: e[12], y: e[13], z: e[14] };
        } catch (err) {}
        crates.push({
          id: obj.uuid,
          meshRef: obj,
          type: isDestructible ? 'crate' : 'supply',
          worldPos: wp,
          looted: false,
        });
      }
    });
    return crates;
  }

  // ── Estimate player world position from camera ─────────────────
  function getPlayerPos(camera) {
    if (!camera) return null;
    return { x: camera.position.x, y: camera.position.y - 1.6, z: camera.position.z };
  }

  // Distance between two {x,y,z} objects (ignoring y for proximity)
  function dist2D(a, b) {
    if (!a || !b) return Infinity;
    return Math.sqrt((a.x - b.x) ** 2 + (a.z - b.z) ** 2);
  }

  // ── Detect game phase via HUD ──────────────────────────────────
  function detectPhase() {
    const hudEl = document.querySelector('.fixed.inset-0.z-\\[25\\]');
    const playing = !!hudEl;

    // Detect mode from DOM
    const modeText = document.body.innerText;
    if (modeText.includes('SURVIVAL') || modeText.includes('Battle Royale') || modeText.includes('WINNER WINNER')) {
      gameMode = 'survival';
    } else if (modeText.includes('BOMB MODE') || modeText.includes('PLANT') || modeText.includes('DEFUSE')) {
      gameMode = 'bomb';
    } else if (modeText.includes('DEATHMATCH') || modeText.includes('TDM')) {
      gameMode = 'deathmatch';
    } else if (modeText.includes('TERRITORY') || modeText.includes('CAPTURE')) {
      gameMode = 'territory';
    } else {
      gameMode = 'classic';
    }

    return playing;
  }

  // ── Main scan & proximity check loop ──────────────────────────
  let _scene = null;
  let _camera = null;
  let _crates = [];
  let _lastScan = 0;
  const SCAN_INTERVAL  = 4000; // re-scan for new crates every 4s
  const PICKUP_RANGE   = 3.2;  // metres — how close player must be
  const PROMPT_RANGE   = 4.5;  // show prompt hint at this distance

  // Hook into Three.js traversal — find scene + camera
  function hookThree() {
    // Scene/camera are exported by the game itself (no window scanning,
    // which hit cross-origin frames and threw SecurityError).
    try {
      if (window.__arenaScene)  _scene  = window.__arenaScene;
      if (window.__arenaCamera) _camera = window.__arenaCamera;
    } catch (e) {}
    return !!(_scene && _camera);
  }

  function tick() {
    const playing = detectPhase();

    if (!playing) {
      promptEl.style.display = 'none';
      svLootEl.style.display = 'none';
      nearestCrate = null;
      return;
    }

    svLootEl.style.display = gameMode === 'survival' ? 'flex' : 'none';

    // Try to find Three.js context
    if (!_scene) hookThree();

    // Periodic full re-scan
    const now = Date.now();
    if (_scene && (now - _lastScan > SCAN_INTERVAL)) {
      _lastScan = now;
      _crates = scanCrates(_scene);
      // Remove already-looted
      _crates = _crates.filter(c => !lootedSet.has(c.id));
    }

    if (!_scene || !_crates.length) {
      promptEl.style.display = 'none';
      nearestCrate = null;
      return;
    }

    // Get player position
    const pp = _camera ? getPlayerPos(_camera) : null;
    if (!pp) return;

    // Find nearest unlooted crate
    let best = null;
    let bestDist = Infinity;
    for (const c of _crates) {
      if (lootedSet.has(c.id)) continue;
      // Update world position each frame (crates may move with airdrops)
      try { c.meshRef.getWorldPosition && c.meshRef.getWorldPosition({ set(x,y,z){ c.worldPos={x,y,z}; } }); } catch {}
      const d = dist2D(pp, c.worldPos);
      if (d < bestDist) { bestDist = d; best = c; }
    }

    nearestCrate = best;

    if (best && bestDist <= PROMPT_RANGE) {
      // Show prompt
      promptEl.style.display = 'flex';
      lootLabel.textContent   = best.type === 'supply' ? 'LOOT SUPPLY CRATE' : 'LOOT CRATE';
      lootSublabel.textContent = best.type === 'supply'
        ? `SUPPLY CRATE · ${Math.round(bestDist * 10) / 10}M AWAY`
        : `CRATE · ${Math.round(bestDist * 10) / 10}M AWAY`;

      // Auto-loot if within pickup range (for touch auto-approach)
      if (bestDist <= PICKUP_RANGE && !lootedSet.has(best.id)) {
        // Don't auto-loot — wait for E or tap
      }
    } else {
      promptEl.style.display = 'none';
      nearestCrate = null;
    }
  }

  // ── Keyboard handler ──────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.code === 'KeyE' && !eKeyDown && nearestCrate && !lootedSet.has(nearestCrate.id)) {
      eKeyDown = true;
      lootCrate();
    }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'KeyE') eKeyDown = false;
  });

  // ── Touch / click handler ─────────────────────────────────────
  lootBtn.addEventListener('click', () => {
    if (nearestCrate && !lootedSet.has(nearestCrate.id)) lootCrate();
  });
  lootBtn.addEventListener('touchstart', e => {
    e.stopPropagation();
    if (nearestCrate && !lootedSet.has(nearestCrate.id)) lootCrate();
  }, { passive: false });

  // ── Fallback: inject loot effects into game state via DOM ──────
  // The game dispatches keyboard events internally. We bridge our
  // custom events to actual game state by hooking the React root's
  // event system when possible.
  window.addEventListener('pa_loot_health', e => {
    // Flash green health overlay briefly
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;z-index:51;pointer-events:none;background:rgba(57,229,140,.12);transition:opacity .6s;';
    document.body.appendChild(flash);
    requestAnimationFrame(() => setTimeout(() => { flash.style.opacity='0'; setTimeout(()=>flash.remove(),650); }, 50));

    // Try to hook into the game's internal state setter
    // The game's React state is not directly accessible from outside, but
    // we can send keyboard combos or trigger game events.
    // Health regen: press '.' key which some games bind to heal (no binding here),
    // so we emit a custom popup using the existing popup system if present.
    tryInjectPopup(`+${e.detail.amount} HP`, '#39e58c');
  });

  window.addEventListener('pa_loot_shield', e => {
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;z-index:51;pointer-events:none;background:rgba(56,189,248,.12);transition:opacity .6s;';
    document.body.appendChild(flash);
    requestAnimationFrame(() => setTimeout(() => { flash.style.opacity='0'; setTimeout(()=>flash.remove(),650); }, 50));
    tryInjectPopup(`+${e.detail.amount} SHIELD`, '#38bdf8');
  });

  window.addEventListener('pa_loot_ammo', e => {
    tryInjectPopup(`+${e.detail.amount} AMMO`, '#ffcf40');
  });

  window.addEventListener('pa_loot_grenade', e => {
    tryInjectPopup(`+${e.detail.amount} FRAG`, '#ff9a2b');
  });

  window.addEventListener('pa_loot_score', e => {
    tryInjectPopup(`+${e.detail.amount} PTS`, '#19e6ff');
  });

  window.addEventListener('pa_loot_weapon', e => {
    tryInjectPopup(`WEAPON FOUND!`, '#ff3b5c');
    // Trigger the shop weapon swap animation if available
    if (typeof window.__paEquipWeapon === 'function') {
      window.__paEquipWeapon(e.detail.weaponId);
    } else {
      // Simulate pressing 1–5 to switch weapon
      const key = String(e.detail.weaponId + 1);
      document.dispatchEvent(new KeyboardEvent('keydown', { key, code: `Digit${key}`, bubbles: true }));
      setTimeout(() => document.dispatchEvent(new KeyboardEvent('keyup', { key, code: `Digit${key}`, bubbles: true })), 80);
    }
  });

  window.addEventListener('pa_loot_dash', () => {
    tryInjectPopup('DASH RECHARGED!', '#19e6ff');
  });

  // ── Inject a popup into the game's HUD layer ──────────────────
  function tryInjectPopup(text, color) {
    // Find the React-rendered popups zone (centered, about 38% from top)
    // and inject a styled element that matches the game's animate-pop-fade class
    const hud = document.querySelector('.fixed.inset-0.z-\\[25\\]');
    if (!hud) return;

    const popup = document.createElement('div');
    popup.className = 'animate-pop-fade';
    popup.textContent = `✦ ${text}`;
    popup.style.cssText = `
      position:absolute;left:50%;top:38%;
      transform:translateX(-50%);
      font-family:'Oxanium',sans-serif;
      font-size:16px;font-weight:900;
      color:${color};
      text-shadow:0 0 12px ${color};
      letter-spacing:.18em;
      pointer-events:none;
      white-space:nowrap;
      z-index:62;
    `;
    hud.appendChild(popup);
    setTimeout(() => popup.remove(), 1300);
  }

  // ── Also handle the shop's equip-weapon bridge ────────────────
  window.__paEquipWeapon = function(wid) {
    // The shop system already has triggerWeaponSwap — call it if present
    if (typeof window.__paTriggerWeaponSwap === 'function') {
      window.__paTriggerWeaponSwap(wid);
    }
  };

  // ── Survival mode: auto-spawn loot crates periodically ────────
  // When in survival, every ~25s a "virtual loot zone" appears near
  // the player so they can always find loot even without real crates nearby.
  let _svLootTimer = null;
  function scheduleSurvivalLoot() {
    if (_svLootTimer) clearTimeout(_svLootTimer);
    if (gameMode !== 'survival') return;
    _svLootTimer = setTimeout(() => {
      if (gameMode !== 'survival' || !_scene) { scheduleSurvivalLoot(); return; }

      // Create a virtual pickup at the player's position
      const pp = _camera ? getPlayerPos(_camera) : null;
      if (!pp) { scheduleSurvivalLoot(); return; }

      // Create a THREE mesh at a random nearby position
      const THREE = window.THREE || window.b;
      if (!THREE) { scheduleSurvivalLoot(); return; }
      const angle  = Math.random() * Math.PI * 2;
      const dist   = 5 + Math.random() * 8;
      const sx     = pp.x + Math.cos(angle) * dist;
      const sz     = pp.z + Math.sin(angle) * dist;

      const geo  = new THREE.BoxGeometry(1.6, 1.6, 1.6);
      const mat  = new THREE.MeshStandardMaterial({ color: 0xff9a2b, emissive: 0x442200, roughness: .6 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(sx, 0.8, sz);
      mesh.userData.crateIdx = 'sv_' + Date.now();
      mesh.userData.survivalCrate = true;
      _scene.add(mesh);

      // Add a point light so it glows
      const light = new THREE.PointLight(0xff9a2b, 1.2, 8);
      light.position.set(sx, 2, sz);
      _scene.add(light);

      // Pulsing animation
      let t = 0;
      const anim = setInterval(() => {
        t += 0.05;
        mesh.rotation.y = t;
        mesh.position.y = 0.8 + Math.sin(t * 2) * 0.18;
        light.intensity = 1.2 + Math.sin(t * 3) * 0.4;
      }, 30);

      // Track in crate list
      _crates.push({
        id: mesh.uuid,
        meshRef: mesh,
        type: 'supply',
        worldPos: { x: sx, y: 0.8, z: sz },
        looted: false,
        _anim: anim,
        _light: light,
      });

      // Show minimap blip notification
      tryInjectPopup('📦 LOOT CRATE NEARBY', '#ff9a2b');

      // Clean up after 60s
      setTimeout(() => {
        clearInterval(anim);
        _scene.remove(mesh);
        _scene.remove(light);
        lootedSet.add(mesh.uuid);
        _crates = _crates.filter(c => c.id !== mesh.uuid);
        geo.dispose();
        mat.dispose();
      }, 60000);

      scheduleSurvivalLoot();
    }, 25000 + Math.random() * 15000);
  }

  // ── Monitor phase changes ─────────────────────────────────────
  let _prevPhase = false;
  function monitorPhase() {
    const playing = detectPhase();
    if (playing && !_prevPhase) {
      // Just entered a game — reset looted set for new match
      lootedSet.clear();
      _crates = [];
      _scene = null;
      _camera = null;
      _lastScan = 0;
      if (gameMode === 'survival') scheduleSurvivalLoot();
    }
    if (!playing && _prevPhase) {
      if (_svLootTimer) { clearTimeout(_svLootTimer); _svLootTimer = null; }
    }
    _prevPhase = playing;
  }

  // ── Tick loop ─────────────────────────────────────────────────
  function mainLoop() {
    monitorPhase();
    tick();
    requestAnimationFrame(mainLoop);
  }
  requestAnimationFrame(mainLoop);

  // ── Expose for shop bridge ────────────────────────────────────
  window.__paLootSystem = {
    lootCrate,
    getLootedSet: () => lootedSet,
    getNearestCrate: () => nearestCrate,
  };

  console.log('[Pixel Arena Loot] Loaded ✓ — press E near a crate to loot · works in all modes');
})();
</script>
</body>
</html>
